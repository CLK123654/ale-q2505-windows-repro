name: q2505-windows-repro
on:
  workflow_dispatch:
    inputs:
      mode:
        required: true
        default: reference
        type: choice
        options: [reference, verify]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install YAML library
        shell: pwsh
        run: python -m pip install PyYAML==6.0.2
      - name: Install kubectl
        shell: pwsh
        run: |
          $path=Join-Path $env:RUNNER_TEMP kubectl.exe
          Invoke-WebRequest https://dl.k8s.io/release/v1.32.6/bin/windows/amd64/kubectl.exe -OutFile $path
          "KUBECTL_PATH=$path"|Out-File $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Record Windows host
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence|Out-Null
          [ordered]@{caption=(Get-CimInstance Win32_OperatingSystem).Caption;version=(Get-CimInstance Win32_OperatingSystem).Version;build=(Get-CimInstance Win32_OperatingSystem).BuildNumber;runner_image=$env:ImageOS;commit_sha=$env:GITHUB_SHA;workflow_run_id=$env:GITHUB_RUN_ID}|ConvertTo-Json|Set-Content -Encoding utf8NoBOM evidence/windows-host.json
          & $env:KUBECTL_PATH version --client --output=json|Set-Content -Encoding utf8NoBOM evidence/kubectl-version.json
      - name: Generate Reference candidate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'reference' }}
        shell: pwsh
        run: python ./qa/generate_reference.py
      - name: Verify final task
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'verify') }}
        shell: pwsh
        run: |
          New-NetFirewallRule -DisplayName q2505-kubectl-no-external -Direction Outbound -Program $env:KUBECTL_PATH -Action Block|Out-Null
          Get-NetFirewallRule -DisplayName q2505-*-no-*|Select DisplayName,Enabled,Direction,Action|ConvertTo-Json|Set-Content -Encoding utf8NoBOM evidence/network-guard.json
          python ./qa/verify_hashes.py
          python ./qa/windows_verify.py
      - name: Remove network guard
        if: always()
        shell: pwsh
        run: Get-NetFirewallRule -DisplayName q2505-*-no-* -ErrorAction SilentlyContinue|Remove-NetFirewallRule
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: q2505-windows-evidence, path: 'evidence/**', if-no-files-found: error, retention-days: 1}
